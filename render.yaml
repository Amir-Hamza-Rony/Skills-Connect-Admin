# ============================================================================
# Skills Connect Admin — Render Production Deployment Blueprint
# Single Next.js service: frontend + backend (API routes) on one service.
# ============================================================================

services:
  # ---------------------------------------------------------------
  # Next.js Application (Web Service) — frontend + API on port 3000
  # ---------------------------------------------------------------
  - type: web
    name: skills-connect-admin
    env: node
    plan: standard
    region: oregon
    buildCommand: "npm ci && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: 1
      - key: MONGODB_URI
        sync: false    # Set manually in Render dashboard
      - key: MONGODB_DB
        value: skills_connect_admin
      - key: MONGODB_TIMEOUT_MS
        value: 10000
      - key: NEXT_PUBLIC_API_BASE_URL
        value: ""      # Empty = relative /api/* routes to Next.js API handlers
      - key: NEXT_PUBLIC_APP_NAME
        value: Skills Connect Admin
      - key: JWT_ACCESS_SECRET
        sync: false    # Generate 32+ random chars — never commit
      - key: JWT_REFRESH_SECRET
        sync: false    # MUST differ from JWT_ACCESS_SECRET
      - key: ACCESS_TOKEN_TTL_MIN
        value: 15
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 7
      - key: COOKIE_SECURE
        value: true    # Production uses HTTPS
      - key: COOKIE_SAME_SITE
        value: lax
      - key: LOGIN_RATE_LIMIT_MAX
        value: 5
      - key: LOGIN_RATE_LIMIT_WINDOW_MIN
        value: 15
      - key: ACCOUNT_LOCK_MAX_FAILURES
        value: 10
      - key: ACCOUNT_LOCK_MINUTES
        value: 15
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: Super Admin
      # QuickBooks (optional — degrades gracefully when not configured)
      - key: QB_REALM_ID
        sync: false
      - key: QB_CLIENT_ID
        sync: false
      - key: QB_CLIENT_SECRET
        sync: false
      - key: QB_SANDBOX
        value: false
      - key: QB_WEBHOOK_SECRET
        sync: false
      - key: QB_INCOME_ACCOUNT_ID
        value: 1
    healthCheckPath: /api/health/ready
    autoDeploy: false

  # ---------------------------------------------------------------
  # Background Worker — BullMQ queue + hourly overdue sweep
  # Runs separately so jobs stay alive 24/7 (Express reference worker).
  # ---------------------------------------------------------------
  - type: worker
    name: skills-connect-admin-worker
    env: node
    plan: standard
    region: oregon
    buildCommand: "npm ci && npm run server:build"
    startCommand: "node server/dist/worker.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: skills_connect_admin
      - key: REDIS_URL
        sync: false
      - key: QB_REALM_ID
        sync: false
      - key: QB_CLIENT_ID
        sync: false
      - key: QB_CLIENT_SECRET
        sync: false
      - key: QB_SANDBOX
        value: false

databases:
  - name: skills-connect-redis
    plan: starter
    region: oregon
