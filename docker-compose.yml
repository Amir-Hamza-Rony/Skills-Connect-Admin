# ---------------------------------------------------------------------------
# Skills Connect Admin — local development services.
#
#   docker compose up -d          start redis
#   docker compose ps             check health
#   docker compose down           stop
#   docker compose down -v        stop AND delete volumes
#
# MongoDB is deliberately ABSENT: the database is MongoDB Atlas, reached via
# MONGODB_URI in server/.env. Object storage is also absent — document bytes
# live directly in MongoDB, so there is no MinIO, S3, or R2 service.
#
# Every credential here is a LOCAL DEV PLACEHOLDER. These values are published
# in git and are not secrets. Never reuse them in staging or production.
# ---------------------------------------------------------------------------

services:
  redis:
    image: redis:7-alpine
    container_name: sc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
